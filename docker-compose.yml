services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova_dev
    ports:
      - '5432:5432'
    volumes:
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
